name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: Verify tag matches package version
        run: >-
          python -c 'import os, tomllib;
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"];
          tag = os.environ["GITHUB_REF_NAME"];
          assert tag == f"v{version}", f"tag {tag!r} does not match version {version!r}"'
      - run: python -m pip install build
      - run: python -m build
      - name: Smoke-test the built wheel
        run: |
          python -m venv "${{ runner.temp }}/wheel-smoke"
          "${{ runner.temp }}/wheel-smoke/bin/python" -m pip install dist/*.whl
          "${{ runner.temp }}/wheel-smoke/bin/python" -c "import crestron_nvx"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pycrestron-nvx
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
